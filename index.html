<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Railway Sim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%239acd32'/%3E%3Cpath d='M6 26 L13 6 M26 26 L19 6' stroke='%23555' stroke-width='3'/%3E%3Cpath d='M9 20h14M11 14h10' stroke='%236e5845' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root {
      --hud-bg: rgba(20, 28, 18, 0.62);
      --hud-fg: #f4f6f0;
      --status: #ff5a4f;
      --muted: rgba(244, 246, 240, 0.7);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #bfe3f5;
      font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { position: absolute; inset: 0; display: block; }
    #app canvas.labels { pointer-events: none; }
    .panel {
      position: fixed;
      left: 16px;
      max-width: calc(100vw - 32px);
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--hud-bg);
      color: var(--hud-fg);
      pointer-events: none;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
    }
    #top { top: 12px; display: flex; flex-direction: column; gap: 3px; }
    #roster, #trains { font-weight: 700; }
    /* Train colours are dark, so they mark a swatch rather than the text. */
    #roster::before, #trains span::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      border-radius: 50%;
      vertical-align: -1px;
      background: var(--swatch);
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.85);
    }
    #trains { display: flex; flex-wrap: wrap; gap: 4px 18px; }
    #status { color: var(--status); font-weight: 700; }
    #help { bottom: 12px; color: var(--muted); font-size: 12px; }

    /* Orders panel (src/orders_panel.js), docked top-right. */
    #orders {
      position: fixed;
      top: 12px;
      right: 16px;
      width: 310px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      padding: 8px 10px 10px;
      border-radius: 8px;
      background: var(--hud-bg);
      color: var(--hud-fg);
      backdrop-filter: blur(4px);
    }
    @media (min-width: 700px) {
      #top { max-width: calc(100vw - 32px - 326px); }
    }
    @media (max-width: 699px) {
      /* Phones: the panel sits under the HUD instead of beside it. */
      #orders { top: auto; bottom: 64px; max-height: 55vh; }
    }
    #orders header { display: flex; align-items: center; gap: 8px; }
    #orders h2 { margin: 0; font-size: 15px; flex: 1; }
    #orders .count {
      display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px;
      border-radius: 10px; background: rgba(255, 255, 255, 0.18); font-size: 12px; text-align: center;
    }
    #orders .meta { color: var(--muted); font-size: 12px; font-weight: 500; }
    #orders .cards { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
    #orders .card {
      padding: 6px 8px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.07);
      border-left: 4px solid var(--swatch);
    }
    #orders .card.selected { background: rgba(255, 255, 255, 0.16); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45); }
    #orders .card-head { display: flex; align-items: center; gap: 6px; }
    #orders .title { flex: 1; text-align: left; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
    #orders .swatch {
      width: 10px; height: 10px; border-radius: 50%; background: var(--swatch);
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.85);
    }
    #orders .cars { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
    #orders .cars b { color: var(--hud-fg); min-width: 10px; text-align: center; }
    #orders button, #orders select {
      font: inherit;
      color: inherit;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
    }
    #orders button:hover:not(:disabled), #orders select:hover { background: rgba(255, 255, 255, 0.24); }
    #orders button:disabled { opacity: 0.35; cursor: default; }
    #orders button:focus-visible, #orders select:focus-visible { outline: 2px solid #ffe94a; outline-offset: 1px; }
    #orders button.title { background: none; border: none; padding: 0; }
    #orders button.icon { padding: 0 6px; min-width: 24px; line-height: 20px; }
    #orders button.danger:hover:not(:disabled) { background: rgba(255, 90, 79, 0.45); }
    #orders button.active { background: #ffe94a; color: #1d2416; border-color: #ffe94a; font-weight: 700; }
    #orders button.wide { width: 100%; padding: 5px 8px; }
    #orders select { background-color: #3c4a33; flex: 1; min-width: 0; }
    #orders .stops { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    #orders .stops li { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px; }
    #orders .stops li:hover { background: rgba(255, 255, 255, 0.08); }
    #orders .stops li.current { background: rgba(255, 233, 74, 0.2); }
    #orders .n { width: 16px; text-align: right; color: var(--muted); font-size: 12px; }
    #orders .town-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
    #orders .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #orders .tag { font-size: 11px; padding: 0 5px; border-radius: 8px; background: #ffe94a; color: #1d2416; font-weight: 700; }
    #orders .row-actions { display: inline-flex; gap: 2px; }
    #orders .row-actions button { min-width: 22px; padding: 0 4px; }
    #orders .add { display: flex; gap: 4px; margin-top: 6px; }
    #orders .empty { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    #orders .problem { margin: 6px 0 0; color: #ffb347; font-size: 12px; font-weight: 600; }
    #orders .status { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    #orders .status.warn { color: var(--status); font-weight: 700; }
    [hidden] { display: none !important; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="top" class="panel">
    <div id="hint"></div>
    <div id="roster"></div>
    <div id="trains" hidden></div>
    <div id="status" hidden></div>
  </div>
  <aside id="orders" aria-label="Trains and orders"></aside>
  <div id="help" class="panel">Camera: wheel to zoom · middle-drag to pan · Shift+middle-drag to orbit · arrow keys pan · Q / E rotate</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
